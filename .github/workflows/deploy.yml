name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: cloud-portfolio-789
      
      - name: Build Docker image
        run: |
          gcloud builds submit \
            --tag gcr.io/cloud-portfolio-789/adrian-day6-app \
            --project cloud-portfolio-789
      
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy adrian-day6-app \
            --image=gcr.io/cloud-portfolio-789/adrian-day6-app \
            --platform=managed \
            --region=us-central1 \
            --vpc-connector=training-vpc-connector \
            --allow-unauthenticated \
            --memory=256Mi \
            --timeout=60s \
            --project=cloud-portfolio-789
